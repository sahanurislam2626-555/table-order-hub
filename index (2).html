<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spice & Grill Bistro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--gold:#d9b25f;--gold2:#a8782a;--ink:#0e0b08;--card:#1a1510}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 500px at 50% -100px,#2a2012,var(--ink));color:#f3ead8;min-height:100vh}
.serif{font-family:'Cormorant Garamond',serif}
.card{background:linear-gradient(160deg,#241c13,var(--card));border:1px solid rgba(217,178,95,.22);border-radius:18px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 10px 24px rgba(0,0,0,.5),0 2px 0 #000}
.gbtn{background:linear-gradient(180deg,#f0d487,var(--gold) 50%,var(--gold2));color:#1b1307;font-weight:700;border-radius:12px;box-shadow:0 4px 0 #6d4b13,0 8px 16px rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #6d4b13}
.obtn{border:1px solid rgba(217,178,95,.5);color:var(--gold);border-radius:12px;font-weight:600}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid rgba(217,178,95,.3);font-size:14px;color:#cdbf9f}
.tab.on{background:var(--gold);color:#1b1307;font-weight:700}
.thumb{width:84px;height:84px;border-radius:14px;object-fit:cover;background:#2c2216;flex:none;display:flex;align-items:center;justify-content:center;font-size:34px}
.veg,.nv{width:16px;height:16px;border:2px solid;display:inline-flex;align-items:center;justify-content:center;border-radius:3px}
.veg{border-color:#3fae5a}.veg:after,.nv:after{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.veg{color:#3fae5a}.nv{border-color:#d4483b;color:#d4483b}
.codebox{font-size:clamp(44px,15vw,64px);font-weight:700;letter-spacing:.18em;background:#fff8e6;color:#111;border-radius:16px;padding:14px 8px 14px 22px;text-align:center;font-family:Inter,Arial,sans-serif}
.codein{font-size:32px;text-align:center;letter-spacing:.3em;text-transform:uppercase;background:#120e09;border:2px solid var(--gold);border-radius:14px;padding:12px;width:100%;color:#fff;outline:none}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .3s ease-out}@keyframes pop{from{transform:translateY(24px);opacity:0}}
.step{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:8px;background:#2a2116;color:#8d7f66}
.step.on{background:var(--gold);color:#1b1307;font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid #fff}
</style>
</head>
<body>
<div id="app" class="max-w-2xl mx-auto px-4 pb-32"></div>
<div id="modal"></div>
<script>
/* ===== Config ===== */
const DB_URL='https://restaurant-orders-dba5b-default-rtdb.asia-southeast1.firebasedatabase.app';
const PINS={kitchen:'5190',owner:'2486'};
const IMG='images/'; // put photos as images/<n>.jpg (n = item number below); emoji shown if missing
const CATS=['Starters & Snacks','Main Course','Rice & Biryani','Indian Breads','Beverages','Desserts'];
// [cat, name, description, price, veg, emoji]
const M=[
[0,'Paneer Tikka','Clay-oven cottage cheese, mint chutney',280,1,'🧀'],
[0,'Chicken Tikka','Smoky marinated chicken, charred in the tandoor',320,0,'🍗'],
[0,'Crispy Chilli Baby Corn','Wok-tossed, sweet and spicy glaze',220,1,'🌽'],
[0,'Spring Rolls','Crisp rolls with garden vegetables',180,1,'🥟'],
[0,'Chicken Pakora','Gram-flour fried chicken, chaat masala',260,0,'🍤'],
[1,'Butter Chicken','Tandoori chicken in creamy tomato gravy',380,0,'🍛'],
[1,'Kadai Paneer','Paneer with peppers and roasted spices',320,1,'🍲'],
[1,'Dal Makhani','Black lentils slow-cooked overnight',260,1,'🥘'],
[1,'Chicken Curry','Home-style curry with whole spices',340,0,'🍛'],
[1,'Mix Veg','Seasonal vegetables in onion-tomato masala',240,1,'🥗'],
[2,'Chicken Dum Biryani','Sealed-pot basmati with tender chicken',360,0,'🍚'],
[2,'Veg Biryani','Fragrant basmati with vegetables and saffron',280,1,'🍚'],
[2,'Jeera Rice','Basmati tempered with cumin',160,1,'🍚'],
[2,'Veg Fried Rice','Wok-fried rice with vegetables',200,1,'🍳'],
[3,'Butter Naan','Soft tandoor bread brushed with butter',60,1,'🫓'],
[3,'Garlic Naan','Naan topped with garlic and coriander',70,1,'🫓'],
[3,'Tandoori Roti','Whole-wheat bread from the tandoor',30,1,'🫓'],
[3,'Lachha Paratha','Flaky layered whole-wheat paratha',70,1,'🫓'],
[4,'Masala Chai','Spiced milk tea',40,1,'🍵'],
[4,'Cold Coffee','Chilled coffee with ice cream',120,1,'🧋'],
[4,'Fresh Lime Soda','Sweet or salted',80,1,'🍋'],
[4,'Mango Lassi','Thick yoghurt and mango',110,1,'🥭'],
[4,'Mineral Water','1 litre bottle',30,1,'💧'],
[5,'Gulab Jamun','Two warm milk dumplings in syrup',90,1,'🍮'],
[5,'Brownie with Ice Cream','Warm brownie, vanilla scoop',160,1,'🍨'],
[5,'Rasmalai','Soft cheese discs in saffron milk',120,1,'🍥']
];
const STAT=['confirmed','preparing','ready'],LBL={confirmed:'Order Confirmed',preparing:'Preparing',ready:'Ready'};

/* ===== State ===== */
const P=new URLSearchParams(location.search),V=P.get('view'),T=parseInt(P.get('table'));
const $=id=>document.getElementById(id);
let D={},cart={},sel={},cat=0,code='',conn='connecting',first=true,seen=new Set(),soundOn=true,AC=null,authed=false;
try{authed=sessionStorage.getItem('auth_'+V)==='1'}catch(e){}

/* ===== Sound ===== */
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function chime(force){if(!soundOn&&!force)return;audio();if(!AC)return;[880,1175,1480].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.16;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.55);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.6)})}

/* ===== Firebase ===== */
firebase.initializeApp({databaseURL:DB_URL});
const db=firebase.database();
db.ref('.info/connected').on('value',s=>{conn=s.val()?'live':'offline';pill()});
setTimeout(()=>{if(conn==='connecting'){conn='offline';pill()}},10000);
db.ref('orders').on('value',s=>{
  D=s.val()||{};
  const ids=all().map(o=>o.id);
  let isNew=false;ids.forEach(i=>{if(!seen.has(i)){seen.add(i);isNew=true}});
  if(isNew&&!first&&(V==='kitchen'||V==='owner')&&authed)chime();
  first=false;paint();
},e=>{conn='error';pill()});
function pill(){const e=$('pill');if(!e)return;
  const m={connecting:['Connecting…','#d9b25f'],live:['Live','#3fae5a'],offline:['Offline. Orders will send when you reconnect.','#d4483b'],error:['Cannot read database. Check Firebase rules allow read/write.','#d4483b']}[conn];
  e.textContent=m[0];e.style.color=m[1]}

/* ===== Helpers ===== */
const all=()=>Object.values(D).flatMap(t=>Object.values(t||{})).filter(o=>o&&o.id).sort((a,b)=>(a.ts||0)-(b.ts||0));
const rs=n=>'₹'+n;
const cartItems=()=>Object.entries(cart).map(([i,q])=>({n:M[i][1],q,p:M[i][3]}));
const cartTotal=()=>cartItems().reduce((s,x)=>s+x.p*x.q,0);
const cartCount=()=>Object.values(cart).reduce((s,q)=>s+q,0);
function wait(o){const ahead=all().filter(x=>!x.paid&&x.status!=='ready'&&(x.ts||Infinity)<=(o.ts||Infinity)).reduce((s,x)=>s+(x.items||[]).reduce((a,i)=>a+i.q,0),0);
  const m=Math.min(60,Math.round((8+ahead*1.5)/5)*5);return `About ${m}-${m+5} min (approximate)`}
function head(sub){return `<header class="pt-6 pb-3 flex items-end justify-between"><div><h1 class="serif text-3xl font-bold" style="color:var(--gold)">Spice &amp; Grill Bistro</h1><div class="text-sm text-stone-400">${sub}</div></div><div id="pill" class="text-xs font-semibold text-right max-w-[45%]"></div></header>`}

/* ===== Router ===== */
function paint(){
  if(V==='kitchen'||V==='owner'){if(!authed)return;staff();pill();return}
  if(!$('ord'))return;ordersPanel();pill();
}
function init(){
  if(V==='kitchen'||V==='owner'){authed?staff():gate();pill();return}
  if(!(T>=1&&T<=10)){$('app').innerHTML=head('Welcome')+`<div class="card p-5 mt-4"><p class="mb-3">Scan the QR code or tap the NFC tag on your table to open the menu.</p><div class="grid grid-cols-5 gap-2">${Array.from({length:10},(_,i)=>`<a class="obtn text-center py-2" href="?table=${i+1}">${i+1}</a>`).join('')}</div></div>`;pill();return}
  $('app').innerHTML=head('Table '+String(T).padStart(2,'0'))+`<div id="ord"></div><div id="tabs" class="sticky top-0 z-20 -mx-4 px-4 py-3 flex gap-2 overflow-x-auto" style="background:rgba(14,11,8,.92);backdrop-filter:blur(8px)"></div><div id="menu" class="space-y-3 mt-2"></div><div id="bar"></div>`;
  tabs();menu();bar();ordersPanel();pill();
}

/* ===== Customer ===== */
function tabs(){$('tabs').innerHTML=CATS.map((c,i)=>`<button class="tab ${i===cat?'on':''}" onclick="cat=${i};tabs();menu()">${c}</button>`).join('')}
function menu(){
  $('menu').innerHTML=M.map((m,i)=>m[0]!==cat?'':`<div class="card p-3 flex gap-3"><div class="thumb" id="t${i}"><img class="thumb" src="${IMG}${i+1}.jpg" alt="${m[1]}" loading="lazy" onerror="this.parentNode.textContent='${m[5]}'"></div>
  <div class="flex-1 min-w-0"><div class="flex items-center gap-2"><span class="${m[4]?'veg':'nv'}" title="${m[4]?'Veg':'Non-Veg'}"></span><h3 class="font-semibold leading-tight">${m[1]}</h3></div>
  <p class="text-xs text-stone-400 mt-1">${m[2]}</p><div class="mt-1 font-bold" style="color:var(--gold)">${rs(m[3])}</div>
  <div class="mt-2 flex items-center gap-2"><div class="flex items-center obtn"><button class="w-9 h-9 text-xl" aria-label="Less" onclick="q(${i},-1)">−</button><span id="q${i}" class="w-6 text-center">${sel[i]||1}</span><button class="w-9 h-9 text-xl" aria-label="More" onclick="q(${i},1)">+</button></div>
  <button class="gbtn px-4 h-9 text-sm" onclick="add(${i})">Add to Order</button></div></div></div>`).join('')}
function q(i,d){sel[i]=Math.max(1,Math.min(20,(sel[i]||1)+d));$('q'+i).textContent=sel[i]}
function add(i){cart[i]=(cart[i]||0)+(sel[i]||1);sel[i]=1;$('q'+i).textContent=1;bar()}
function bar(){const n=cartCount();$('bar').innerHTML=n?`<div class="fixed bottom-0 inset-x-0 p-3 z-30" style="background:linear-gradient(transparent,#0e0b08 40%)"><div class="max-w-2xl mx-auto flex items-center gap-3"><div class="flex-1"><div class="text-xs text-stone-400">${n} item${n>1?'s':''}</div><div class="text-xl font-bold">${rs(cartTotal())}</div></div><button class="gbtn px-6 py-3 text-lg" onclick="review()">Review Order</button></div></div>`:''}
function newCode(){const c='ACDEFGHJKMNPRTWXY34679';code=Array.from({length:5},()=>c[Math.floor(Math.random()*c.length)]).join('')}
function review(){newCode();modalReview()}
function modalReview(msg){
  const rows=Object.entries(cart).map(([i,n])=>`<div class="flex justify-between py-1"><span>${M[i][1]} × ${n}</span><span>${rs(M[i][3]*n)}</span></div>`).join('');
  $('modal').innerHTML=`<div class="fixed inset-0 z-40 bg-black/80 flex items-end sm:items-center justify-center"><div class="card pop w-full max-w-md p-5 max-h-[95vh] overflow-y-auto" style="border-radius:24px 24px 0 0">
  <div class="flex justify-between items-center"><h2 class="serif text-2xl font-bold" style="color:var(--gold)">Review Order</h2><button class="text-3xl px-2" aria-label="Close" onclick="$('modal').innerHTML=''">×</button></div>
  <div class="text-stone-400 text-sm mb-2">Table ${String(T).padStart(2,'0')}</div><div class="text-sm border-y border-stone-700 py-2">${rows}</div>
  <div class="flex justify-between text-xl font-bold py-3"><span>Total</span><span>${rs(cartTotal())}</span></div>
  <p class="text-center text-sm text-stone-300 mb-2">Type this code to confirm</p>
  <div class="codebox" id="cb">${code}</div>
  <input id="ci" class="codein mt-3" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Type the 5-character code" oninput="chk(this)">
  <div id="cm" class="text-center text-red-400 h-6 mt-1 text-sm">${msg||''}</div>
  <div class="flex gap-3 mt-1"><button class="obtn flex-1 py-3" onclick="newCode();modalReview()">New Code</button><button class="gbtn flex-1 py-3 text-lg" onclick="chk($('ci'),1)">Confirm</button></div></div></div>`;
  setTimeout(()=>$('ci')&&$('ci').focus(),50)}
function chk(el,force){const v=el.value.toUpperCase();el.value=v;if(v.length<5&&!force)return;
  if(v===code)return submit();
  newCode();modalReview('Code did not match. Try the new code.');const c=$('cb');if(c){c.classList.add('shake')}}
function submit(){
  const ref=db.ref('orders/T'+T).push(),items=cartItems(),total=cartTotal(),backup={...cart};
  const o={id:ref.key,table:T,items,total,status:'confirmed',paid:false,ts:firebase.database.ServerValue.TIMESTAMP};
  cart={};bar(); // cart cleared immediately: reopening cannot resend it
  ref.set(o).catch(()=>{cart=backup;bar();alert('Order could not be sent. Please try again.')});
  chime(true);
  $('modal').innerHTML=`<div class="fixed inset-0 z-40 bg-black/85 flex items-center justify-center p-5"><div class="card pop p-6 text-center max-w-sm w-full"><div class="text-5xl mb-2">✅</div><h2 class="serif text-3xl font-bold" style="color:var(--gold)">Aapka order confirm ho gaya hai!</h2><p class="mt-3">Table ${String(T).padStart(2,'0')}</p><p class="text-2xl font-bold mt-1">${rs(total)}</p><button class="gbtn w-full py-3 mt-5 text-lg" onclick="$('modal').innerHTML=''">View my order</button></div></div>`}
function ordersPanel(){
  const el=$('ord');if(!el)return;
  const os=Object.values(D['T'+T]||{}).filter(o=>o&&o.id&&!o.paid).sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(!os.length){el.innerHTML='';return}
  const sum=os.reduce((s,o)=>s+o.total,0);
  el.innerHTML=`<div class="card p-4 mb-3"><h2 class="serif text-xl font-bold mb-2" style="color:var(--gold)">Your orders</h2>`+os.map(o=>{const si=STAT.indexOf(o.status);return `<div class="py-2 border-b border-stone-800"><div class="text-sm text-stone-300">#${o.id.slice(-4).toUpperCase()} · ${(o.items||[]).map(i=>i.n+' ×'+i.q).join(', ')}</div><div class="flex gap-1 my-2">${STAT.map((s,k)=>`<div class="step ${k<=si?'on':''}">${LBL[s]}</div>`).join('')}</div><div class="flex justify-between text-sm"><span class="text-stone-400">${o.status==='ready'?'Ready to serve':wait(o)}</span><b>${rs(o.total)}</b></div></div>`}).join('')+`<div class="flex justify-between text-xl font-bold pt-3"><span>Total bill</span><span>${rs(sum)}</span></div></div>`}

/* ===== Staff ===== */
function gate(){
  $('app').innerHTML=head(V==='kitchen'?'Kitchen Display':'Owner Counter')+`<div class="card p-6 mt-8 text-center"><p class="mb-3">Enter PIN</p><input id="pin" type="password" inputmode="numeric" maxlength="4" class="codein" style="letter-spacing:.5em" oninput="if(this.value.length===4)pin(this.value)"><div id="pe" class="text-red-400 h-6 mt-2 text-sm"></div></div>`;pill()}
function pin(v){if(v===PINS[V]){authed=true;try{sessionStorage.setItem('auth_'+V,'1')}catch(e){}audio();staff()}else{$('pin').value='';$('pe').textContent='Wrong PIN'}}
function tog(){soundOn=!soundOn;if(soundOn)chime(true);staff()}
function setSt(t,id,s){db.ref(`orders/${t}/${id}/status`).set(s)}
function pay(t){
  const os=Object.values(D[t]||{}).filter(o=>o&&o.id&&!o.paid);
  if(!os.length||!confirm(`Mark ${t.replace('T','Table ')} as paid (${rs(os.reduce((s,o)=>s+o.total,0))})?`))return;
  const u={};os.forEach(o=>{u[`orders/${t}/${o.id}`]=null;u[`history/${o.id}`]={...o,paid:true,paidAt:firebase.database.ServerValue.TIMESTAMP}});
  db.ref().update(u)}
function staff(){
  const os=all().filter(o=>!o.paid),k=V==='kitchen';
  let body='';
  if(k){body=os.length?[...os].sort((a,b)=>(a.status==='ready')-(b.status==='ready')||(a.ts||0)-(b.ts||0)).map(o=>`<div class="card p-4 ${o.status==='ready'?'opacity-50':''}"><div class="flex justify-between"><b class="text-xl">Table ${String(o.table).padStart(2,'0')}</b><span class="text-sm" style="color:var(--gold)">${LBL[o.status]}</span></div><ul class="my-2">${(o.items||[]).map(i=>`<li class="text-lg">${i.q} × ${i.n}</li>`).join('')}</ul>
  <div class="flex gap-2">${o.status==='confirmed'?`<button class="gbtn flex-1 py-2" onclick="setSt('T${o.table}','${o.id}','preparing')">Preparing</button>`:''}${o.status!=='ready'?`<button class="gbtn flex-1 py-2" onclick="setSt('T${o.table}','${o.id}','ready')">Ready</button>`:''}</div></div>`).join(''):'<p class="text-center text-stone-400 mt-10">No active orders.</p>'}
  else{const by={};os.forEach(o=>(by['T'+o.table]=by['T'+o.table]||[]).push(o));const ks=Object.keys(by).sort((a,b)=>a.slice(1)-b.slice(1));
  body=`<div class="card p-4 flex justify-between"><span>Unpaid total</span><b class="text-xl">${rs(os.reduce((s,o)=>s+o.total,0))}</b></div>`+(ks.length?ks.map(t=>`<div class="card p-4"><div class="flex justify-between items-center"><b class="text-xl">Table ${t.slice(1).padStart(2,'0')}</b><b class="text-xl" style="color:var(--gold)">${rs(by[t].reduce((s,o)=>s+o.total,0))}</b></div>${by[t].map(o=>`<div class="text-sm text-stone-300 mt-1">#${o.id.slice(-4).toUpperCase()} · ${(o.items||[]).map(i=>i.n+' ×'+i.q).join(', ')} · ${LBL[o.status]} · ${rs(o.total)}</div>`).join('')}<button class="gbtn w-full py-3 mt-3" onclick="pay('${t}')">Mark Paid</button></div>`).join(''):'<p class="text-center text-stone-400 mt-10">No unpaid tables.</p>')}
  $('app').innerHTML=head(k?'Kitchen Display':'Owner Counter')+`<div class="flex justify-end mb-3"><button class="obtn px-4 py-2 text-sm" onclick="tog()">Sound: ${soundOn?'On':'Off'}</button></div><div class="space-y-3">${body}</div>`}

init();
</script>
</body>
</html>
